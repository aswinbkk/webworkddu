<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        nav {
            background-color: antiquewhite;
            padding: 15px;
        }

        .list {
            display: flex;
            justify-content: center;
            gap: 20px;
            list-style: none;
        }

        .list li {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        .list li:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>

    <nav>
        <ul class="list">
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </nav>

</body>
</html>
