<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .hero {
            height: 100vh;
            background: url("cover_image.jpg") center/cover no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            text-align: center;
            color: white;
            max-width: 700px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
        }

        .content h1 {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .content p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .content button {
            padding: 12px 28px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        .content button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

    <section class="hero">
        <div class="content">
            <h1>Welcome</h1>

            <p>
                Description: cover_image, cover_image,
                cover_image, cover_image, cover_image,
                cover_image, cover_image.
            </p>

            <button>Get Started</button>
        </div>
    </section>

</body>

</html>
