<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main_container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }

        .grid_container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .grid_container img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="main_container">

        <div class="grid_container">

            <img src="/cover_image.jpg" alt="Image 1">
            <img src="/cover_image.jpg" alt="Image 2">
            <img src="/cover_image.jpg" alt="Image 3">
            <img src="/cover_image.jpg" alt="Image 4">
            <img src="/cover_image.jpg" alt="Image 5">
            <img src="/cover_image.jpg" alt="Image 6">

        </div>

    </div>

</body>

</html>>
